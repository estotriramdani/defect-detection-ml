<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>{% block title %}Deteksi Cacat Label Kemasan{% endblock %}</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute;overflow:hidden">
        <defs>
            <symbol id="i-scan" viewBox="0 0 24 24">
                <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M4 12h16"/>
            </symbol>
            <symbol id="i-camera" viewBox="0 0 24 24">
                <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/>
                <circle cx="12" cy="13" r="3.2"/>
            </symbol>
            <symbol id="i-upload" viewBox="0 0 24 24">
                <path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
            </symbol>
            <symbol id="i-image" viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <circle cx="8.5" cy="9.5" r="1.5"/>
                <path d="m21 15-5-5L5 20"/>
            </symbol>
            <symbol id="i-check" viewBox="0 0 24 24">
                <path d="m5 12 5 5L20 6"/>
            </symbol>
            <symbol id="i-alert" viewBox="0 0 24 24">
                <path d="M12 3 2 21h20L12 3Z"/>
                <path d="M12 9v5M12 18h.01"/>
            </symbol>
            <symbol id="i-help" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="M9.5 9a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2.3-2.4 2.3M12 17h.01"/>
            </symbol>
            <symbol id="i-print" viewBox="0 0 24 24">
                <path d="M7 8V3h10v5M7 17H5a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2"/>
                <rect x="7" y="14" width="10" height="7" rx="1"/>
            </symbol>
            <symbol id="i-trash" viewBox="0 0 24 24">
                <path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/>
            </symbol>
            <symbol id="i-database" viewBox="0 0 24 24">
                <ellipse cx="12" cy="6" rx="8" ry="3"/>
                <path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
            </symbol>
            <symbol id="i-cog" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
            </symbol>
            <symbol id="i-spark" viewBox="0 0 24 24">
                <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/>
            </symbol>
            <symbol id="i-save" viewBox="0 0 24 24">
                <path d="M5 3h11l3 3v15H5V3Z"/>
                <path d="M8 3v6h7V3M8 21v-7h8v7"/>
            </symbol>
            <symbol id="i-folder" viewBox="0 0 24 24">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>
            </symbol>
            <symbol id="i-chart" viewBox="0 0 24 24">
                <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
            </symbol>
            <symbol id="i-info" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 11v5M12 8h.01"/>
            </symbol>
            <symbol id="i-arrow-right" viewBox="0 0 24 24">
                <path d="M5 12h14M13 6l6 6-6 6"/>
            </symbol>
            <symbol id="i-plus" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14"/>
            </symbol>
            <symbol id="i-x" viewBox="0 0 24 24">
                <path d="m6 6 12 12M18 6 6 18"/>
            </symbol>
            <symbol id="i-play" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7L8 5Z"/>
            </symbol>
            <symbol id="i-refresh" viewBox="0 0 24 24">
                <path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/>
            </symbol>
        </defs>
    </svg>

    <nav class="global-nav" aria-label="Navigasi utama">
        <div class="global-nav__inner">
            <a class="brand" href="{{ url_for('main.index') }}">
                <span class="brand__mark" aria-hidden="true">
                    <svg class="icon"><use href="#i-scan"></use></svg>
                </span>
                <span>Deteksi Cacat Label</span>
            </a>
            <div class="global-nav__links">
                <a class="global-nav__link {% if not request.path.startswith('/training') %}is-active{% endif %}"
                   href="{{ url_for('main.index') }}">Deteksi</a>
                <a class="global-nav__link {% if request.path.startswith('/training') %}is-active{% endif %}"
                   href="{{ url_for('training.training') }}">Training</a>
            </div>
        </div>
    </nav>

    {% block local_nav %}{% endblock %}

    <main id="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container site-footer__inner">
            <p>2025 Sistem Deteksi Cacat Label. Dibuat dengan Flask &amp; scikit-learn.</p>
            <div class="site-footer__links">
                <a href="{{ url_for('main.index') }}">Deteksi</a>
                <a href="{{ url_for('training.training') }}">Training</a>
            </div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
